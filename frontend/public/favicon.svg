<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Tile -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="#0b0e14" stroke="url(#favGrad)" stroke-width="2.5" />

  <!-- Inner Soft Ambient Glow -->
  <rect x="6" y="6" width="52" height="52" rx="12" fill="url(#favGrad)" fill-opacity="0.08" />

  <!-- Iconic Futuristic Cyber "S" Mark -->
  <path
    d="M44 20H26a6 6 0 0 0-6 6v1a6 6 0 0 0 6 6h12a6 6 0 0 1 6 6v1a6 6 0 0 1-6 6H20"
    stroke="url(#favGrad)"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#favGlow)"
  />

  <!-- High-Tech Neon Terminal Dots -->
  <circle cx="20" cy="20" r="3" fill="#34d399" />
  <circle cx="44" cy="46" r="3" fill="#a78bfa" />
</svg>
